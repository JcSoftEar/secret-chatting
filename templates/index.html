<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>秘密聊天</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 入口页 -->
    <div id="entryPage" class="entry-container">
        <div class="entry-card">
            <h1 class="entry-title">进入聊天室</h1>
            <form id="entryForm">
                <div class="form-group">
                    <label for="roomId">房间号</label>
                    <input type="text" id="roomId" placeholder="请输入房间号" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label for="nickname">昵称</label>
                    <input type="text" id="nickname" placeholder="不填则随机生成">
                </div>
                <button type="submit" class="btn">进入房间</button>
                <div id="entryError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 聊天页 -->
    <div id="chatPage" class="chat-container" style="display: none;">
        <div class="chat-header">
            <button class="back-btn" id="backBtn">‹</button>
            <span class="room-name" id="roomName"></span>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" disabled>发送</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
